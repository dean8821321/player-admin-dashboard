<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d12">
  <title>Admin Login | Player Dashboard</title>

  <script src="vendor/supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #090d12;
      color: #f1f5f9;
      font-family: Inter, Arial, sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #10291e;
      color: #35d28b;
      font-size: 27px;
      font-weight: 800;
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .brand p {
      margin-top: 9px;
      color: #8995a5;
      font-size: 13px;
    }

    .login-card {
      padding: 32px;
      background: #111821;
      border: 1px solid #25313d;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .login-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      color: #8995a5;
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 47px;
      padding: 0 14px;
      background: #0b1118;
      border: 1px solid #2b3745;
      border-radius: 9px;
      outline: none;
      color: #f1f5f9;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #35d28b;
    }

    input::placeholder {
      color: #596575;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #35d28b;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 7px;
      border: none;
      border-radius: 9px;
      background: #20b978;
      color: #06130c;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .login-button:hover {
      background: #35d28b;
    }

    .login-button:active {
      transform: scale(0.99);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #351b20;
      border: 1px solid #71313d;
      color: #ff9ba8;
    }

    .message.success {
      display: block;
      background: #122c20;
      border: 1px solid #246b49;
      color: #6de5a8;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #647181;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 25px 21px;
      }

      .brand h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="login-wrapper">

    <header class="brand">
      <div class="brand-icon">P</div>
      <h1>Player Admin</h1>
      <p>Central Video Player Management System</p>
    </header>

    <section class="login-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">
        Sign in to access your administration dashboard.
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
            >Show</button>
          </div>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          Sign In
        </button>

        <div id="message" class="message" role="status" aria-live="polite"></div>
      </form>
    </section>

    <footer class="footer">
      &copy; 2026 Player Admin Dashboard. All rights reserved.
    </footer>

  </main>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://bpmxvnipjafoagxrgmzd.supabase.co";

      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_Doyjl1xRpyUtic5PBw5NCg_5eSrFhZX";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginButton = document.getElementById("loginButton");
      const togglePassword = document.getElementById("togglePassword");
      const message = document.getElementById("message");

      let redirecting = false;

      function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
      }

      function setLoading(loading) {
        loginButton.disabled = loading;
        loginButton.textContent = loading ? "Signing in..." : "Sign In";
      }

      function goToDashboard() {
        if (redirecting) return;
        redirecting = true;
        window.location.replace("./dashboard.html");
      }

      togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        togglePassword.textContent = isPassword ? "Hide" : "Show";
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage("Email dan password wajib diisi.", "error");
          return;
        }

        setLoading(true);
        message.className = "message";

        try {
          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) {
            throw error;
          }

          if (!data.user) {
            throw new Error("User tidak ditemukan.");
          }

          passwordInput.value = "";
          loginButton.textContent = "Membuka dashboard...";
          goToDashboard();

        } catch (error) {
          console.error("Login error:", error);

          await supabaseClient.auth.signOut();

          let errorText = "Login gagal. Silakan periksa email dan password.";

          if (
            error.message &&
            error.message.toLowerCase().includes("email not confirmed")
          ) {
            errorText = "Email belum dikonfirmasi. Periksa pengaturan akun.";
          } else if (
            error.message &&
            error.message.toLowerCase().includes("tidak memiliki akses")
          ) {
            errorText = error.message;
          } else if (
            error.message &&
            error.message.toLowerCase().includes("memverifikasi")
          ) {
            errorText = error.message;
          }

          showMessage(errorText, "error");
          setLoading(false);
        }
      });

      async function checkExistingSession() {
        try {
          const { data, error } = await supabaseClient.auth.getSession();

          if (error) {
            throw error;
          }

          if (!data.session || !data.session.user) {
            return;
          }

          setLoading(true);
          loginButton.textContent = "Membuka dashboard...";
          goToDashboard();

        } catch (error) {
          console.error("Existing session check error:", error);
          await supabaseClient.auth.signOut();
          message.className = "message";
          setLoading(false);
        }
      }

      checkExistingSession();

    })();
  </script>
</body>
</html>
